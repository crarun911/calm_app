name: tranqlo
description: Tranqlo — Find your calm.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.66.2
  intl: ^0.19.0
  flutter_animate: ^4.3.0
  just_audio: ^0.9.40
  rename: ^3.1.0
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
